log_format dduo_without_query '$remote_addr - $remote_user [$time_local] '
  '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16m;
  access_log /var/log/nginx/access.log dduo_without_query;
  add_header Referrer-Policy "no-referrer" always;

  location /api/ {
    proxy_pass http://api:8000/;
  }

  # The HTML document selects the versioned Vite bundle. Never reuse it after
  # a local image update: a live tab could otherwise keep rendering an older
  # navigation while the API and the deployed dashboard have already changed.
  location = /index.html {
    error_log /dev/null;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # Vite fingerprints every emitted asset, so immutable caching is both safe
  # and avoids re-downloading the unchanged application code on each visit.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location / {
    # nginx errors may embed the original request line, including link tokens.
    error_log /dev/null;
    try_files $uri /index.html;
  }
}
