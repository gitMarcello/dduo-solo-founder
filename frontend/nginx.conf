server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16m;

  location /api/ {
    proxy_pass http://api:8000/;
  }

  # The HTML document selects the versioned Vite bundle. Never reuse it after
  # a local image update: a live tab could otherwise keep rendering an older
  # navigation while the API and the deployed dashboard have already changed.
  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
  }

  # Vite fingerprints every emitted asset, so immutable caching is both safe
  # and avoids re-downloading the unchanged application code on each visit.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
