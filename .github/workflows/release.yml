name: Beta release

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_and_package:
    name: Verify and package Beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      release_commit: ${{ steps.package.outputs.release_commit }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release authority
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
          else
            test "${GITHUB_REF}" = "refs/heads/main"
            test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Materialize locked Python dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen --extra dev

      - name: Validate versions, plugin, skill, and support boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            uv run --frozen --extra dev python scripts/validate_release.py --tag "${GITHUB_REF_NAME}"
          else
            uv run --frozen --extra dev python scripts/validate_release.py
          fi
          uv run --frozen --extra dev pytest -q --no-cov \
            tests/test_agent_plugin_package.py \
            tests/test_distribution.py::test_release_versions_are_aligned

      - name: Verify immutable source checksums
        run: |
          node scripts/generate-checksums.mjs
          git diff --exit-code -- checksums.sha256
          node --test tests/checksum-manifest.test.mjs tests/native-command.test.mjs tests/copy-plugin-files.test.mjs

      - name: Lint and test Python
        run: |
          uv run --frozen --extra dev ruff check backend tests benchmarks scripts migrations
          uv run --frozen --extra dev pytest -q -m "not onboarding"
          uv run --frozen --extra dev pytest -q --no-cov -m onboarding

      - name: Lint, test, and build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Cross-platform installer dry run
        run: node bin/install.mjs --dry-run --yes

      - name: Locked core and native adapter transactions
        run: uv run --frozen --extra dev python scripts/native_installer_smoke.py

      - name: Build source artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          artifact_name="dduo-solo-founder-${version}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="${artifact_name}/" \
            --output="dist/${artifact_name}.tar.gz" \
            "${GITHUB_SHA}"
          cp checksums.sha256 "dist/${artifact_name}.checksums.sha256"
          (
            cd dist
            sha256sum "${artifact_name}.tar.gz" "${artifact_name}.checksums.sha256" \
              > SHA256SUMS
          )
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          echo "release_commit=${release_commit}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test packaged installer
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="${{ steps.package.outputs.artifact_name }}"
          smoke_root="${RUNNER_TEMP}/dduo-release-smoke"
          smoke_home="${RUNNER_TEMP}/dduo-release-home"
          runner_home="${HOME}"
          fake_bin="${smoke_home}/bin"
          project_root="${smoke_home}/project"
          mkdir -p "${smoke_root}" "${fake_bin}" "${project_root}/.git"
          tar -xzf "dist/${artifact_name}.tar.gz" -C "${smoke_root}"
          printf '%s\n' \
            '#!/bin/sh' \
            'if [ "$1" = "--version" ]; then echo "codex-cli 0.150.0"; fi' \
            'if [ "$1" = "features" ] && [ "$2" = "list" ]; then echo "hooks stable true"; fi' \
            'if [ "$1" = "plugin" ] && [ "$2" = "list" ]; then echo '\''{"installed":[],"available":[]}'\''; fi' \
            'if [ "$1" = "app-server" ]; then' \
            '  IFS= read -r _initialize' \
            '  printf '\''{"id":1,"result":{}}\n'\''' \
            '  IFS= read -r _initialized' \
            '  IFS= read -r _hooks_list' \
            '  printf '\''{"id":2,"result":{"data":[{"cwd":"%s","hooks":[{"pluginId":"dduo-solo-founder@personal","eventName":"sessionStart","enabled":true,"trustStatus":"untrusted"},{"pluginId":"dduo-solo-founder@personal","eventName":"userPromptSubmit","enabled":true,"trustStatus":"untrusted"},{"pluginId":"dduo-solo-founder@personal","eventName":"stop","enabled":true,"trustStatus":"untrusted"}]}]}}\n'\'' "$DDUO_RELEASE_SMOKE_PROJECT_ROOT"' \
            'fi' \
            > "${fake_bin}/codex"
          printf '%s\n' '#!/bin/sh' 'exit 0' > "${fake_bin}/browser"
          chmod 755 "${fake_bin}/codex" "${fake_bin}/browser"
          export HOME="${smoke_home}"
          export XDG_CONFIG_HOME="${smoke_home}/.config"
          export XDG_DATA_HOME="${smoke_home}/.local/share"
          export UV_CACHE_DIR="${runner_home}/.cache/uv"
          export UV_TOOL_BIN_DIR="${fake_bin}"
          export UV_TOOL_DIR="${smoke_home}/uv-tools"
          export PATH="${fake_bin}:${PATH}"
          export BROWSER="${fake_bin}/browser"
          export DDUO_SOLO_FOUNDER_CODEX_DESKTOP="${smoke_home}/missing-codex-desktop"
          export DDUO_RELEASE_SMOKE_PROJECT_ROOT="${project_root}"
          timeout 900 node \
            "${smoke_root}/${artifact_name}/bin/install.mjs" \
            --only codex --project-root "${project_root}" --yes
          node "${smoke_root}/${artifact_name}/bin/install.mjs" \
            --verify --only codex --project-root "${project_root}"
          "${fake_bin}/dduo-solo-founder" bridge-stop

      - name: Upload verified source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: verify_and_package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified source package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify_and_package.outputs.artifact_name }}
          path: dist

      - name: Verify and publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.verify_and_package.outputs.release_commit }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify_and_package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum --check SHA256SUMS
          )
          tag_object="$(
            gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" \
              --jq '[.object.type, .object.sha] | @tsv'
          )"
          IFS=$'\t' read -r object_type object_sha <<< "${tag_object}"
          for _depth in 1 2 3 4; do
            if [[ "${object_type}" == "commit" ]]; then
              break
            fi
            if [[ "${object_type}" != "tag" ]]; then
              echo "Tag ${RELEASE_TAG} resolves to unsupported object ${object_type}." >&2
              exit 1
            fi
            tag_object="$(
              gh api "repos/${GH_REPO}/git/tags/${object_sha}" \
                --jq '[.object.type, .object.sha] | @tsv'
            )"
            IFS=$'\t' read -r object_type object_sha <<< "${tag_object}"
          done
          if [[ "${object_type}" != "commit" || "${object_sha}" != "${RELEASE_COMMIT}" ]]; then
            echo "Tag ${RELEASE_TAG} moved after verification; refusing to publish." >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" \
            "dist/dduo-solo-founder-${RELEASE_VERSION}.tar.gz" \
            "dist/dduo-solo-founder-${RELEASE_VERSION}.checksums.sha256" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --generate-notes \
            --title "dDuo Solo Founder ${RELEASE_VERSION}"
