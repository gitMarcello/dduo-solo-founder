name: Live OpenAI E2E

on:
  workflow_dispatch:

jobs:
  semantic-round-trip:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Require the repository secret
        run: test -n "$OPENAI_API_KEY"
      - name: Run durable semantic round trip
        run: ./scripts/e2e-live.sh
